<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 · 量子弦之链</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">🎵 量子弦之链</a>
      <div class="nav-links">
        <a href="index.html">社区</a>
        <a href="https://quantum-string.com" target="_blank">主站</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
      </div>
    </div>
  </nav>

  <main class="container auth-page">
    <div class="auth-card">
      <h2>🔐 设置新密码</h2>
      <p class="auth-hint">请输入你的新密码（至少 6 位）</p>
      <form id="resetForm">
        <div class="form-group">
          <label>新密码</label>
          <input type="password" id="newPassword" required placeholder="至少 6 位" minlength="6">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="confirmPassword" required placeholder="再次输入" minlength="6">
        </div>
        <div id="resetError" class="error-msg" style="display:none;"></div>
        <div id="resetSuccess" class="success-msg" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-block">重置密码</button>
      </form>
      <p class="auth-link"><a href="login.html">返回登录</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('resetError');
      const successEl = document.getElementById('resetSuccess');

      errEl.style.display = 'none';
      successEl.style.display = 'none';

      if (pwd !== confirm) {
        errEl.textContent = '两次输入的密码不一致';
        errEl.style.display = 'block';
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: pwd });

      if (error) {
        errEl.textContent = '重置失败：' + error.message;
        errEl.style.display = 'block';
        return;
      }

      successEl.textContent = '✅ 密码已更新！3 秒后跳转到登录页...';
      successEl.style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 3000);
    });
  </script>
  <script src="theme.js"></script>
</body>
</html>
