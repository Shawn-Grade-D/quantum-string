<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../static/favicon-32x32.png">\n  <link rel="apple-touch-icon" sizes="180x180" href="../static/apple-touch-icon.png">\n  <title>个人主页 · 量子弦之链</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="../static/logo-horizontal.png" alt="量子弦之链" class="nav-logo-img"></a>
      <div class="nav-links">
        <a href="index.html">社区</a>
        <a href="https://quantum-string.com" target="_blank">主站</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
      </div>
      <div class="nav-auth">
        <span id="userDisplay" style="display:none;"></span>
        <a href="login.html" id="loginBtn">登录</a>
        <a href="register.html" id="registerBtn">注册</a>
        <a href="#" id="logoutBtn" style="display:none;" onclick="logout()">退出</a>
      </div>
    </div>
  </nav>

  <main class="container profile-page">
    <!-- 顶部横幅 -->
    <div class="profile-banner">
      <div class="banner-bg"></div>
      <div class="profile-header">
        <div class="avatar-section">
          <div class="avatar-wrapper" id="avatarWrapper" style="cursor:default;">
            <img id="profileAvatar" class="avatar-img" src="" alt="" onerror="this.style.display='none'">
            <div id="avatarPlaceholder" class="avatar-placeholder">👤</div>
          </div>
          <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="uploadAvatar()">
          <div id="avatarUploadMsg" class="upload-msg" style="display:none;"></div>
        </div>
        <div class="profile-info">
          <h1 id="profileNickname" class="profile-name">加载中...</h1>
          <p id="profileBio" class="profile-bio"></p>
          <div class="profile-meta">
            <span id="profileJoinDate" class="meta-item"></span>
          </div>
        </div>
        <div class="profile-actions" id="profileActions" style="display:none;">
          <button class="btn btn-outline" onclick="editProfile()">✏️ 编辑资料</button>
          <button class="btn btn-outline" onclick="changePassword()">🔐 修改密码</button>
        </div>
      </div>
    </div>

    <!-- 编辑资料弹窗 -->
    <div id="editModal" class="modal" style="display:none;">
      <div class="modal-content auth-card">
        <h2>编辑个人资料</h2>
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="editNickname" maxlength="20" placeholder="你的社区名字">
        </div>
        <div class="form-group">
          <label>个性签名</label>
          <textarea id="editBio" maxlength="140" rows="2" placeholder="介绍一下自己..."></textarea>
        </div>
        <div class="form-group">
          <label>个人网站</label>
          <input type="url" id="editWebsite" placeholder="https://...">
        </div>
        <div id="editError" class="error-msg" style="display:none;"></div>
        <div class="modal-btns">
          <button class="btn btn-primary" onclick="saveProfile()">保存</button>
          <button class="btn btn-outline" onclick="closeEditModal()">取消</button>
        </div>
      </div>
    </div>

    <!-- 标签页切换 -->
    <div class="profile-tabs">
      <button class="tab-btn active" data-tab="posts">📝 帖子</button>
      <button class="tab-btn" data-tab="comments">💬 评论</button>
      <button class="tab-btn" data-tab="bookmarks">⭐ 收藏</button>
      <button class="tab-btn" data-tab="about">📋 关于</button>
    </div>

    <!-- 帖子列表 -->
    <div id="tab-posts" class="tab-content active">
      <div id="userPostsList" class="posts-list">
        <div class="loading">加载中...</div>
      </div>
    </div>

    <!-- 评论列表 -->
    <div id="tab-comments" class="tab-content">
      <div id="userCommentsList" class="comments-list">
        <div class="loading">加载中...</div>
      </div>
    </div>

    <!-- 收藏列表 -->
    <div id="tab-bookmarks" class="tab-content">
      <div id="userBookmarksList" class="posts-list">
        <div class="loading">加载中...</div>
      </div>
    </div>

    <!-- 关于 -->
    <div id="tab-about" class="tab-content">
      <div class="about-card">
        <div class="about-item">
          <span class="about-label">加入时间</span>
          <span id="aboutJoinDate">-</span>
        </div>
        <div class="about-item">
          <span class="about-label">帖子数</span>
          <span id="aboutPostCount">-</span>
        </div>
        <div class="about-item">
          <span class="about-label">网站</span>
          <span id="aboutWebsite">-</span>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
  <script src="theme.js"></script>
</body>
</html>
