<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../static/favicon-32x32.png">\n  <link rel="apple-touch-icon" sizes="180x180" href="../static/apple-touch-icon.png">\n  <title>发帖 · 观测者社区 | New Post · Observer Community</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="../static/logo-horizontal.png" alt="量子弦之链" class="nav-logo-img"></a>
      <div class="nav-links">
        <a href="index.html">社区</a>
        <a href="https://quantum-string.com" target="_blank">主站</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
      </div>
      <div class="nav-auth">
        <span id="userDisplay" style="display:none;"></span>
        <a href="login.html" id="loginBtn">登录</a>
        <a href="register.html" id="registerBtn">注册</a>
        <a href="#" id="logoutBtn" style="display:none;" onclick="logout()">退出</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="post-form-wrapper">
      <h1>✏️ 写一篇文章</h1>
      <form id="newPostForm">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="postTitle" required placeholder="给你的文章起个名字" maxlength="100">
        </div>
        <div class="form-group">
          <label>内容 <span class="label-hint">（支持图片，点击下方 📷 按钮插入）</span></label>
          <textarea id="postContent" rows="12" required placeholder="写点什么吧...支持 Markdown 格式"></textarea>
          <div class="upload-bar">
            <button type="button" class="btn-upload" id="postImageBtn" title="插入图片">📷 插入图片</button>
            <input type="file" id="postImageInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;">
            <span id="postUploadStatus" class="upload-status"></span>
          </div>
        </div>
        <div class="form-group">
          <label>标签（逗号分隔）</label>
          <input type="text" id="postTags" placeholder="例如：弦理论, 量子计算, 哲学">
        </div>
        <div id="postError" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn btn-primary">发布</button>
        <a href="index.html" class="btn btn-outline">取消</a>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="theme.js"></script>
</body>
</html>
