name: Wake Supabase

# 北京时间每天凌晨 4:00 执行（UTC 20:00）
# 避开高峰期，静默请求 Supabase API 防止免费层休眠
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:  # 允许手动触发测试

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "Supabase response: HTTP $STATUS"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 401 ] || [ "$STATUS" -eq 400 ]; then
            echo "✅ Supabase is alive (status $STATUS)"
          else
            echo "⚠️ Unexpected status: $STATUS"
          fi
