<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="postDetailTitle">帖子 · 观测者社区 | Post · Observer Community</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="../static/images/logo-horizontal.png" alt="量子弦之链" class="nav-logo-img"></a>
      <div class="nav-links">
        <a href="index.html">社区</a>
        <a href="https://quantum-string.com" target="_blank">主站</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
      </div>
      <div class="nav-auth">
        <span id="userDisplay" style="display:none;"></span>
        <a href="login.html" id="loginBtn">登录</a>
        <a href="register.html" id="registerBtn">注册</a>
        <a href="#" id="logoutBtn" style="display:none;" onclick="logout()">退出</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div id="postDetail" class="post-detail">
      <div class="loading">加载中...</div>
    </div>

    <div class="comments-section">
      <h3>💬 评论</h3>
      <div id="commentForm" style="display:none;">
        <textarea id="commentContent" rows="3" placeholder="写下你的想法..." required></textarea>
        <div class="comment-form-actions">
          <select id="commentVisibility" class="visibility-select">
            <option value="public">🌐 公开</option>
            <option value="private">🔒 仅帖主可见</option>
          </select>
          <button type="button" class="btn-upload btn-upload-sm" id="commentImageBtn" title="插入图片">📷</button>
          <input type="file" id="commentImageInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none;">
          <span id="commentUploadStatus" class="upload-status"></span>
          <button class="btn btn-primary" onclick="submitComment()">发表评论</button>
        </div>
      </div>
      <div id="commentsList" class="comments-list"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="theme.js"></script>
</body>
</html>
