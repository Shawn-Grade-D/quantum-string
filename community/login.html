<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../static/images/favicon-32x32.png">\n  <link rel="apple-touch-icon" sizes="180x180" href="../static/images/apple-touch-icon.png">\n  <title>登录 · 观测者社区 | Login · Observer Community</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="../static/images/logo-horizontal.png" alt="量子弦之链" class="nav-logo-img"></a>
      <div class="nav-links">
        <a href="index.html">社区</a>
        <a href="https://quantum-string.com" target="_blank">主站</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
      </div>
    </div>
  </nav>

  <main class="container auth-page">
    <div class="auth-card">
      <h2>登录</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="loginEmail" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <div id="loginError" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
      </form>
      <p class="auth-link">还没有账号？<a href="register.html">注册</a> · <a href="forgot-password.html">忘记密码？</a></p>
      <hr>
      <p class="auth-alt-label">或使用以下方式登录：</p>
      <button id="githubLoginBtn" class="btn btn-outline btn-block">🐙 使用 GitHub 登录</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
</body>
</html>
