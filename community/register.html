<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../static/favicon-32x32.png">\n  <link rel="apple-touch-icon" sizes="180x180" href="../static/apple-touch-icon.png">\n  <title>注册 · 观测者社区 | Register · Observer Community</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><img src="../static/logo-horizontal.png" alt="量子弦之链" class="nav-logo-img"></a>
      <div class="nav-links">
        <a href="index.html">社区</a>
        <a href="turtle-run.html">🐢 小游戏</a>
        <a href="https://quantum-string.com" target="_blank">主站</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
      </div>
    </div>
  </nav>

  <main class="container auth-page">
    <div class="auth-card">
      <h2>注册</h2>
      <p class="auth-hint">注册即代表你同意遵守社区规则：友善、尊重、有料。</p>
      <form id="registerForm">
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="regNickname" required placeholder="你的社区名字" maxlength="20">
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="regEmail" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPassword" required placeholder="至少 6 位" minlength="6">
        </div>
        <div id="regError" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-block">注册</button>
      </form>
      <p class="auth-link">已有账号？<a href="login.html">登录</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
</body>
</html>
