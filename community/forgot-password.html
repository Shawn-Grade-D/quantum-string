<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 · 量子弦之链</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">🎵 量子弦之链</a>
      <div class="nav-links">
        <a href="index.html">社区</a>
        <a href="https://quantum-string.com" target="_blank">主站</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
      </div>
    </div>
  </nav>

  <main class="container auth-page">
    <div class="auth-card">
      <h2>🔐 忘记密码</h2>
      <p class="auth-hint">输入你的注册邮箱，我们会发送密码重置链接。</p>
      <form id="forgotForm">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="forgotEmail" required placeholder="your@email.com">
        </div>
        <div id="forgotError" class="error-msg" style="display:none;"></div>
        <div id="forgotSuccess" class="success-msg" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-block">发送重置链接</button>
      </form>
      <p class="auth-link"><a href="login.html">返回登录</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      const errEl = document.getElementById('forgotError');
      const successEl = document.getElementById('forgotSuccess');

      errEl.style.display = 'none';
      successEl.style.display = 'none';

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/community/reset-password.html'
      });

      if (error) {
        errEl.textContent = '发送失败：' + error.message;
        errEl.style.display = 'block';
        return;
      }

      successEl.innerHTML = '✅ 重置链接已发送至 <strong>' + email + '</strong>，请检查邮箱（含垃圾箱）。';
      successEl.style.display = 'block';
      document.getElementById('forgotForm').style.display = 'none';
    });
  </script>
  <script src="theme.js"></script>
</body>
</html>
